<svg viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <!-- Graphite squircle background. rx=228 ≈ 22% of 1024, the Big Sur ratio. -->
  <rect x="0" y="0" width="1024" height="1024" rx="228" ry="228" fill="#0e0f12"/>

  <!-- Subtle inner highlight ring (1.5px @ 1024 = invisible at small sizes,
       but lifts the tile in screenshots). -->
  <rect x="6" y="6" width="1012" height="1012" rx="222" ry="222"
        fill="none" stroke="#1c1e24" stroke-width="3"/>

  <!-- Tree-view glyph in chrome cyan. Bold strokes (80px) so it survives at 16x16.
       Trunk + 3 branches, like the sidebar's worktree list. -->
  <g stroke="#7aa2f7" stroke-width="80" stroke-linecap="round" fill="none">
    <line x1="320" y1="288" x2="320" y2="720"/>
    <line x1="320" y1="400" x2="600" y2="400"/>
    <line x1="320" y1="560" x2="700" y2="560"/>
    <line x1="320" y1="720" x2="560" y2="720"/>
  </g>

  <!-- Claude-magenta cap on the bottom branch — nods to the ✦ Claude group
       without trying to render the sparkle glyph (which is font-dependent). -->
  <circle cx="640" cy="720" r="60" fill="#b59cf5"/>
</svg>
