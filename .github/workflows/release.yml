name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag/version label (e.g. v0.2.0-rc1). Used as the release name.'
        required: true
        default: 'v0.0.0-manual'
      draft:
        description: 'Publish as a draft (skip release notes if true)'
        type: boolean
        required: false
        default: true

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 30
    permissions:
      # Needed for softprops/action-gh-release to create the Release.
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      # See ci.yml for the rationale — distutils is gone from Python 3.12+,
      # so pin 3.11 for node-gyp to find it.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Package macOS (arm64 + x64)
        run: npm run package:mac
        env:
          # Disable signing — the local cert in this checkout is expired.
          # When you renew the cert, replace this block with:
          #   CSC_LINK: ${{ secrets.CSC_LINK }}
          #   CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          #   APPLE_ID: ${{ secrets.APPLE_ID }}
          #   APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          #   APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # and set hardenedRuntime: true + entitlements in electron-builder.yml
          # (already present). electron-builder will sign + notarize automatically.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: List artifacts
        run: ls -lh release/

      # Always upload the built artifacts to the workflow run, so even a
      # manual dispatch without a Release attaches downloadable files.
      - uses: actions/upload-artifact@v4
        with:
          name: treeline-app-macos
          path: |
            release/*.dmg
            release/*.zip
          if-no-files-found: error
          retention-days: 30

      # Create / update the Release on tag pushes.
      - name: Create GitHub Release (tag trigger)
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            release/*.dmg
            release/*.zip

      # Manual dispatch path: publish a draft Release the user can review.
      - name: Create GitHub Release (manual dispatch)
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag }}
          name: ${{ github.event.inputs.tag }}
          draft: ${{ github.event.inputs.draft }}
          fail_on_unmatched_files: true
          files: |
            release/*.dmg
            release/*.zip
