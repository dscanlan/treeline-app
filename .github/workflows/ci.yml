name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Cancel an in-progress run if a newer commit lands on the same branch.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      # node-pty's native rebuild is driven by node-gyp, which still imports
      # `distutils` — removed in Python 3.12+. macos-latest runners ship 3.13,
      # so pin 3.11 explicitly. Without this, `npm ci` fails at the
      # postinstall step with `ModuleNotFoundError: No module named 'distutils'`.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # `npm ci` runs the postinstall (electron-builder install-app-deps),
      # which downloads Electron and rebuilds node-pty against its ABI.
      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm test

      # `npm run build` exercises the electron-vite production bundle —
      # cheaper than full packaging but catches main/preload/renderer
      # bundling regressions before a release.
      - name: Build (no package)
        run: npm run build
