appId: dev.treeline.app
productName: Treeline
directories:
  output: release
  buildResources: resources
files:
  - 'out/**/*'
  - 'package.json'
  # The scriptable CLI client. asarUnpack keeps it a real on-disk file so the
  # generated shim can exec it via ELECTRON_RUN_AS_NODE (you can't run a script
  # that lives inside the asar archive). See src/main/cli-install.ts.
  - 'bin/**'
asarUnpack:
  - 'bin/**'
extraMetadata:
  main: out/main/index.js
mac:
  # Default name for mac artifacts. Without this, electron-builder would
  # suffix universal builds as `-universal` (e.g. Treeline-0.3.0-universal.dmg);
  # we strip that since universal is the only mac arch we ship. The DMG
  # gets a per-format override below to omit the trailing `-mac` tag.
  artifactName: ${productName}-${version}-mac.${ext}
  target:
    - target: dmg
      arch: universal
    - target: zip
      arch: universal
  category: public.app-category.developer-tools
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: resources/entitlements.mac.plist
  entitlementsInherit: resources/entitlements.mac.plist
dmg:
  artifactName: ${productName}-${version}.${ext}
# Publish target for electron-updater. We never have electron-builder
# actually upload to GitHub itself (the release.yml workflow uploads the
# artifacts via softprops/action-gh-release), but the provider config is
# what tells electron-builder to bake the feed URL into latest-mac.yml so
# the in-app updater knows where to look. `--publish never` on the CLI
# keeps the upload step disabled.
publish:
  provider: github
  owner: dscanlan
  repo: treeline-app
  # Don't surface pre-release tags (e.g. v0.4.0-rc1) to stable users.
  releaseType: release
